# manyworldz entering the Metaculus FutureEval bot tournament, on a timer.
#
# Every 20 minutes it fetches the tournament's open questions (binary,
# multiple choice, numeric, discrete), runs the crowd or a direct call
# per type, submits an answer plus the required private comment to any
# question it has not already answered, and commits the submission log
# back to the repo. It never touches Kalshi or the ledger; this is a
# separate public scorecard.
#
# Safe to push before the tournament account exists. tournament.py's own
# main() checks for METACULUS_TOKEN first: if it is missing, the run
# prints a warning annotation and exits 0, so the schedule can stay
# ACTIVE with no red X's while the owner is still waiting on the token.
#
# That grace ENDS on config.TOURNAMENT_ARM_BY (2026-09-01, Fall
# FutureEval). Past that date an unset token exits 1 and the run goes
# red. The Summer 2026 season was lost to ~2,000 green no-op cycles;
# "not configured" must not look identical to "working".
#
# To turn it on once the account exists:
#   1. Create the bot account on metaculus.com, generate an API token
#      (see the FutureEval participate page).
#   2. On github.com: repo Settings -> Secrets and variables -> Actions
#      -> New repository secret -> name METACULUS_TOKEN, paste it.
#   3. Make sure ANTHROPIC_API_KEY is already set as a secret too (the
#      manyworldz.yml workflow needs the same one).
#   4. Optional, when Metaculus's free credits land: add OPENROUTER_API_KEY
#      (donated LLM credits; engine/llm.py routes through OpenRouter when
#      it exists; check the model slugs on openrouter.ai and set
#      OPENROUTER_MODEL_MAP if the anthropic/<id> guess is wrong) and
#      ASKNEWS_CLIENT_ID + ASKNEWS_CLIENT_SECRET (free news for entrants;
#      engine/news.py uses them automatically).
#   5. That's it. The Actions tab shows every run; data/tournament_log.csv
#      fills up with every submission, question by question.

name: tournament

on:
  schedule:
    # Every 20 minutes, on purpose: the questions are only open 1.5 to
    # 3 hours, and a question you never answered scores a hard zero.
    # Three explicit lines instead of */20 because GitHub is known to
    # drop */N schedules at busy minutes; ranked bots (No-Stream's
    # run_bot_on_tournament.yaml) split theirs for the same reason.
    - cron: "3 * * * *"
    - cron: "23 * * * *"
    - cron: "43 * * * *"
  workflow_dispatch: {}       # also lets you run it by hand from the Actions tab

permissions:
  contents: write             # so it can commit the submission log back

concurrency:
  group: tournament
  cancel-in-progress: false   # never cut a run off partway through

jobs:
  run:
    runs-on: ubuntu-latest
    # Shorter than the 20-minute cadence: with cancel-in-progress off,
    # a hung run would otherwise queue every later cron behind it.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: fetch open questions, run the crowd, submit answers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          # Metaculus publishes its own finding on this: "having a SOTA
          # model matters more than bot infrastructure." Their leaderboard
          # backs it up (haiku scores about 3, sonnet about 9, the top
          # models score 15 to 20). So the tournament runs a stronger
          # voice than the Kalshi loop does, even though it costs more.
          # Once the free tournament credits land, move this to opus or
          # fable. The budget cap in config.py still stops all spending.
          MANYWORLDZ_MODEL: sonnet
          # Monthly spend allowance (engine/llm.py meters by calendar
          # month). Raise once donated OpenRouter credits arrive.
          ENGINE_BUDGET_USD: "15"
          # Optional: all four below stay empty until their secrets exist.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL_MAP: ${{ vars.OPENROUTER_MODEL_MAP }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_CLIENT_SECRET: ${{ secrets.ASKNEWS_CLIENT_SECRET }}
        run: python3 tournament.py

      - name: save the submission log back to the repo
        run: |
          git config user.name "manyworldz-bot"
          git config user.email "actions@users.noreply.github.com"
          # || true: a cycle with nothing new to answer leaves the file untouched
          git add data/tournament_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "tournament: cycle log update"
          git push
